; WARM runtime PHP overrides
expose_php = Off
; Uploads are read into one buffer and may be processed; the largest accepted
; file is a 100 MB document (application cap 105 MB in config/warm.php).
memory_limit = 512M
upload_max_filesize = 105M
post_max_size = 110M
max_execution_time = 600
max_input_time = 600
date.timezone = UTC
