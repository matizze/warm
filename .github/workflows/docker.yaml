name: Build & Push Docker (GHCR)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch_name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          GIT_HASH="${{ steps.vars.outputs.sha_short }}"
          BRANCH="${{ steps.vars.outputs.branch_name }}"

          echo "Building ${REGISTRY}:${GIT_HASH} (${BRANCH}) for linux/amd64,linux/arm64"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg WWWUSER=1000 \
            --build-arg WWWGROUP=1000 \
            -f deployment/Dockerfile \
            -t ${REGISTRY}:${GIT_HASH} \
            -t ${REGISTRY}:${BRANCH} \
            -t ${REGISTRY}:latest \
            --push \
            .

          echo "Pushed: ${REGISTRY}:${GIT_HASH}"

      # Production deploys only from main. DEPLOY_WEBHOOK holds one Portainer
      # service webhook URL per line (app, worker, scheduler); `?tag=` repoints
      # each service to the image just pushed.
      - name: Deploy (Portainer webhooks)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          GIT_HASH: ${{ steps.vars.outputs.sha_short }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK}" ]; then
            echo "DEPLOY_WEBHOOK not set, skipping deploy."
            exit 0
          fi

          for url in ${DEPLOY_WEBHOOK}; do
            curl -fsS -X POST "${url}?tag=${GIT_HASH}"
          done

          echo "Deploy triggered for ${GIT_HASH}"
