name: Build & Push Docker (GHCR)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

# Um build por ref, sem cancelar o anterior: evita que um push novo
# sobrescreva tags de um build ainda em andamento.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pull request: só valida que a imagem compila. Sem login no GHCR e sem push.
  build:
    name: Build (PR, sem publicação)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            WWWUSER=1000
            WWWGROUP=1000
          tags: warm-pr:${{ github.sha }}
          cache-from: type=gha,scope=warm
          cache-to: type=gha,mode=max,scope=warm

      - name: Confirm local image
        run: docker image inspect "warm-pr:${GITHUB_SHA}" >/dev/null

  # Push em main/develop (e dispatch manual): publica no GHCR.
  publish:
    name: Publish (push)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          tags="${REGISTRY}:${sha}"

          case "${GITHUB_REF}" in
            refs/heads/main)
              tags="${tags}"$'\n'"${REGISTRY}:main"$'\n'"${REGISTRY}:latest"
              ;;
            refs/heads/develop)
              tags="${tags}"$'\n'"${REGISTRY}:develop"
              ;;
          esac

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            WWWUSER=1000
            WWWGROUP=1000
          cache-from: type=gha,scope=warm
          cache-to: type=gha,mode=max,scope=warm

      - name: Verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          docker buildx imagetools inspect "${REGISTRY}@${DIGEST}" >/dev/null
          {
            echo "### Imagem publicada"
            echo ""
            echo "- SHA: \`${SHA}\`"
            echo "- Imagem: \`${REGISTRY}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy apenas em push para main, por digest imutável, após build+push.
  deploy:
    name: Deploy production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://warm.matizze.com.br
    concurrency:
      group: warm-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
      IMAGE_SHA: ${{ needs.publish.outputs.sha }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}

    steps:
      - name: Deploy image by digest
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_WEBHOOK:?secret DEPLOY_WEBHOOK obrigatório no environment production}"
          : "${DEPLOY_TOKEN:?secret DEPLOY_TOKEN obrigatório no environment production}"
          : "${IMAGE_DIGEST:?publish não expôs digest}"

          payload="$(jq -cn \
            --arg image "$IMAGE" \
            --arg sha "$IMAGE_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            '{image:$image,sha:$sha,digest:$digest}')"

          status="$(curl -sS -o /tmp/deploy-response.json -w '%{http_code}' \
            --fail-with-body \
            -X POST "$DEPLOY_WEBHOOK" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload")"

          echo "deploy webhook HTTP ${status}"
          cat /tmp/deploy-response.json

      - name: Verify running image matches digest
        env:
          DEPLOY_STATUS_URL: ${{ secrets.DEPLOY_STATUS_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_STATUS_URL:?secret DEPLOY_STATUS_URL obrigatório no environment production}"

          for attempt in $(seq 1 30); do
            body="$(curl -fsS "$DEPLOY_STATUS_URL" \
              -H "Authorization: Bearer ${DEPLOY_TOKEN}" || true)"
            running="$(printf '%s' "$body" | jq -r '.digest // empty' 2>/dev/null || true)"

            if [ "${running}" = "${IMAGE_DIGEST}" ]; then
              echo "OK: imagem em execução é ${running}"
              exit 0
            fi

            echo "tentativa ${attempt}: em execução '${running}', esperado '${IMAGE_DIGEST}'"
            sleep 10
          done

          echo "::error::stack não convergiu para ${IMAGE_DIGEST} após o deploy"
          exit 1
